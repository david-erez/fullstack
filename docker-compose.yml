services:
  liquibase:
    image: liquibase/liquibase:5.0.1
    container_name: liquibase-container-SupermarketDB
    volumes:
      ./backend/liquibase:/workspace/
      ./backend/liquibase/drivers/mssql-jdbc-13.4.0.jre8.jar:/liquibase/lib/mssql.jar
    command: >
      --defaultsFile=/workspace/liquibase.properties
      --searchPath=/workspace
      update
    depends_on:
      sql-server
    networks:
      sql-network